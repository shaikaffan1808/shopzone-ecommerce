<div class="auth-page"><div class="auth-card"><div class="logo">Shop<span>Zone</span></div><h1>{{ 'auth.createAccount' | translate }}</h1><form (ngSubmit)="signup()"><label>{{ 'auth.name' | translate }}</label><input type="text" name="name" [(ngModel)]="name" [placeholder]="'auth.namePlaceholder' | translate" /><label>{{ 'auth.email' | translate }}</label><input type="email" name="email" [(ngModel)]="email" [placeholder]="'auth.emailPlaceholder' | translate" /><label>{{ 'auth.password' | translate }}</label><input type="password" name="password" [(ngModel)]="password" [placeholder]="'auth.passwordPlaceholder' | translate" /><label>{{ 'auth.confirmPassword' | translate }}</label><input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" [placeholder]="'auth.confirmPasswordPlaceholder' | translate" />@if (errorMessage) { <div class="error">{{ errorMessage }}</div> }<button type="submit">{{ 'auth.createYourAccount' | translate }}</button></form><p class="login-text">{{ 'auth.alreadyHave' | translate }} <a routerLink="/login">{{ 'auth.signIn' | translate }}</a></p></div></div>
